# Copy to harness.toml or pass --config.
# Paths in workspace.roots are the only repositories the app will open.

[server]
host = "127.0.0.1"
port = 7465

[workspace]
roots = ["examples/sample-repo"]

[provider]
# Serve uses a live model when Ollama is running or OPENAI_API_KEY / XAI_API_KEY
# is set. Pin GPT-5.6 Luna with HARNESS_PROVIDER=openai and OPENAI_API_KEY.
# "deterministic" is for `harness demo` and tests only.
# name = "openai_compat"

[verification]
# Software decides completion. pytest is the default; name another command here
# for a project that proves itself differently. Operators set this, not models.
# command = ["npm", "test", "--silent"]
# timeout = 600
# shell_timeout = 120

[data]
dir = ".harness"
# Isolated stages are full copies of a repository. Keep the newest N.
# keep_stages = 20
